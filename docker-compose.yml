# PUBG Oracle — local multi-container stack
# Run: docker compose up --build
# Only `api` publishes a port; bot and scheduler talk to it over the internal network.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - models-data:/app/models
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: .
    command: python bot/telegram_bot.py
    environment:
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - BOT_TOKEN=${BOT_TOKEN}
      - MY_CHAT_ID=${MY_CHAT_ID}
      - MIN_PROFIT_THRESHOLD=${MIN_PROFIT_THRESHOLD:-300}
      - TARGET_CHATS=${TARGET_CHATS:-}
      - API_URL=http://api:8000
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
    volumes:
      - models-data:/app/models
      - app-data:/app/data
      - bot-sessions:/app/sessions
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # process-based: the bot must be running
      test: ["CMD", "pgrep", "-f", "telegram_bot.py"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    command: python ops/scheduler.py
    environment:
      - SCHEDULER_INTERVAL_MINUTES=${SCHEDULER_INTERVAL_MINUTES:-360}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - API_URL=http://api:8000
    volumes:
      - models-data:/app/models
      - app-data:/app/data
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "scheduler.py"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  models-data:
  app-data:
  bot-sessions:
